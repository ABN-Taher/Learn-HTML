    <title>Mohamed Taher | تواصل معي</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Tahoma, sans-serif;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #050816;
            color: white;

            overflow: hidden;
        }


        /* =========================
           الإضاءات في الخلفية
        ========================= */

        body::before {
            content: "";

            position: fixed;

            width: 500px;
            height: 500px;

            top: -200px;
            right: -180px;

            background: #00d9ff;

            border-radius: 50%;

            filter: blur(170px);

            opacity: .18;

            z-index: -1;

            animation: blueGlow 8s infinite alternate ease-in-out;
        }


        body::after {
            content: "";

            position: fixed;

            width: 500px;
            height: 500px;

            bottom: -220px;
            left: -180px;

            background: #7c3aed;

            border-radius: 50%;

            filter: blur(170px);

            opacity: .18;

            z-index: -1;

            animation: purpleGlow 10s infinite alternate ease-in-out;
        }


        @keyframes blueGlow {

            from {
                transform: translate(0, 0) scale(1);
            }

            to {
                transform: translate(-120px, 130px) scale(1.2);
            }

        }


        @keyframes purpleGlow {

            from {
                transform: translate(0, 0) scale(1);
            }

            to {
                transform: translate(130px, -100px) scale(1.2);
            }

        }


        /* =========================
           المربع الرئيسي
        ========================= */

        .container {

            width: 90%;
            max-width: 650px;

            padding: 45px 30px;

            text-align: center;

            background:
                rgba(10, 16, 35, .82);

            backdrop-filter: blur(25px);

            border:
                1px solid rgba(255,255,255,.1);

            border-radius: 30px;

            box-shadow:
                0 30px 100px rgba(0,0,0,.6);

            animation: containerIn 1s ease;

        }


        @keyframes containerIn {

            from {
                opacity: 0;

                transform:
                    translateY(60px)
                    scale(.9);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }

        }


        /* =========================
           اللوجو
        ========================= */

        .profile {

            width: 90px;
            height: 90px;

            margin: 0 auto 20px;

            display: flex;

            justify-content: center;
            align-items: center;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #00d9ff,
                    #6366f1,
                    #8b5cf6
                );

            font-size: 42px;

            box-shadow:
                0 0 45px rgba(0,217,255,.3);

            animation:
                floating 3s infinite ease-in-out;

        }


        @keyframes floating {

            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }

        }


        /* =========================
           الاسم
        ========================= */

        h1 {

            font-size: 45px;

            margin-bottom: 10px;

            background:
                linear-gradient(
                    90deg,
                    white,
                    #00d9ff,
                    #8b5cf6,
                    white
                );

            background-size: 300%;

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;

            animation:
                gradientMove 5s infinite linear;

        }


        @keyframes gradientMove {

            from {
                background-position: 0%;
            }

            to {
                background-position: 300%;
            }

        }


        .subtitle {

            color: #9ba7bd;

            font-size: 17px;

            margin-bottom: 35px;

        }


        /* =========================
           الأزرار
        ========================= */

        .contact {

            display: flex;

            flex-direction: column;

            gap: 15px;

        }


        .contact a {

            position: relative;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 15px;

            padding: 17px;

            border-radius: 16px;

            background:
                rgba(15,23,42,.9);

            border:
                1px solid #263247;

            color: white;

            text-decoration: none;

            font-size: 17px;

            font-weight: bold;

            transition: .35s ease;

            overflow: hidden;

        }


        .contact a::before {

            content: "";

            position: absolute;

            width: 0;
            height: 100%;

            top: 0;
            right: 0;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,.08)
                );

            transition: .4s;

        }


        .contact a:hover::before {

            width: 100%;

        }


        .contact a:hover {

            transform:
                translateY(-5px)
                scale(1.02);

        }


        /* =========================
           أيقونات التواصل
        ========================= */

        .icon {

            width: 30px;
            height: 30px;

            display: flex;

            justify-content: center;
            align-items: center;

            flex-shrink: 0;

        }


        /* الهاتف */

        .phone:hover {

            border-color: #38bdf8;

            box-shadow:
                0 15px 40px
                rgba(56,189,248,.2);

        }

        /* واتساب */

        .whatsapp .icon {

        }


        /* إنستجرام */

                0 15px 40px
                rgba(225,48,108,.2);

        }


        .instagram .icon {

        /* Gmail */

            box-shadow:
                0 15px 40px
                rgba(234,67,53,.2);

        }


        .email .icon {

            color: #EA4335;

        }


        /* =========================
           الفوتر
        ========================= */

        footer {

            margin-top: 30px;

            color: #64748b;

            font-size: 14px;

        }


        footer strong {

            color: #00d9ff;

        }


        /* =========================
           الموبايل
        ========================= */

            .container {

                padding: 35px 20px;

            }


            h1 {

                font-size: 34px;

            }


            .profile {

                width: 75px;
                height: 75px;

                font-size: 34px;

            }


            .contact a {

                font-size: 15px;

            }

        }

    </style>
